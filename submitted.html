<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KYC Submitted Successfully</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
    }

    .success-box {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .check {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #22c55e;
      color: white;
      font-size: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #222;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    .kyc-number {
      margin: 25px 0;
      padding: 15px;
      background: #f1f5f9;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      color: #111827;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="success-box">

    <div class="check">✓</div>

    <h1>Submission Successful!</h1>

    <p>
      Your KYC information has been successfully submitted.
    </p>

    <div class="kyc-number">
      KYC No: <span id="kycNumber">---</span>
    </div>

    <p>
      Please keep your KYC number for future reference.
    </p>

    <a href="index.html" class="button">
      Submit Another KYC
    </a>

  </div>

  <script>
    const kycNumber =
      sessionStorage.getItem("kycNumber");

    if (kycNumber) {
      document.getElementById("kycNumber").textContent =
        kycNumber;
    }
  </script>

</body>
</html>
